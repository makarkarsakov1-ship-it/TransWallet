plugins {
    id 'com.android.application'
}

android {
    namespace 'com.transwallet'
    compileSdk 33
    defaultConfig {
        applicationId "com.transwallet"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}
